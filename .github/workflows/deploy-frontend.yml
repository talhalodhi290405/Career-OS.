name: Deploy Frontend → Azure Web Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'Dockerfile.frontend'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  # ── Update these to match your Azure resources ─────────────────────────────
  AZURE_WEBAPP_NAME: careeros-frontend
  AZURE_CONTAINER_APP_NAME: careeros-backend
  AZURE_RESOURCE_GROUP: careeros-rg
  IMAGE_NAME: careeros-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Azure Login ────────────────────────────────────────────────────
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── 3. Login to Azure Container Registry ─────────────────────────────
      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # ── 4. Build & Push Docker Image ──────────────────────────────────────
      - name: Build and push frontend image
        run: |
          IMAGE_TAG=${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          IMAGE_LATEST=${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

          docker build \
            --file Dockerfile.frontend \
            --tag $IMAGE_TAG \
            --tag $IMAGE_LATEST \
            --cache-from $IMAGE_LATEST \
            .

          docker push $IMAGE_TAG
          docker push $IMAGE_LATEST

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # ── 5. Resolve backend ingress ────────────────────────────────────────
      - name: Resolve backend URL
        run: |
          BACKEND_FQDN=$(az containerapp show \
            --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "CAREEROS_BACKEND_URL=https://$BACKEND_FQDN" >> "$GITHUB_ENV"

      # ── 6. Configure App Settings ────────────────────────────────────────
      - name: Set App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              {
                "name": "CAREEROS_BACKEND_URL",
                "value": "${{ env.CAREEROS_BACKEND_URL }}",
                "slotSetting": false
              },
              {
                "name": "WEBSITES_PORT",
                "value": "3000",
                "slotSetting": false
              }
            ]

      # ── 7. Deploy Container to Azure Web App ─────────────────────────────
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE_TAG }}

      # ── 8. Smoke Test ─────────────────────────────────────────────────────
      - name: Smoke test — ping frontend
        run: |
          sleep 30
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/")
          echo "Frontend health status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Health check returned $STATUS — review Azure portal"
          fi

      # ── 9. Logout ─────────────────────────────────────────────────────────
      - name: Azure Logout
        run: az logout
        if: always()
