name: Deploy Backend → Azure Container Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'main.py'
      - 'agent.py'
      - 'rpa_agent.py'
      - 'requirements.txt'
      - 'Dockerfile.backend'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # Allow manual trigger

env:
  # ── Update these to match your Azure resources ─────────────────────────────
  AZURE_CONTAINER_APP_NAME: careeros-backend
  AZURE_RESOURCE_GROUP: careeros-rg
  IMAGE_NAME: careeros-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Authenticate with Azure ────────────────────────────────────────
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── 3. Login to Azure Container Registry ─────────────────────────────
      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # ── 4. Build & Push Docker Image ──────────────────────────────────────
      - name: Build and push backend image
        run: |
          IMAGE_TAG=${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          IMAGE_LATEST=${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

          docker build \
            --file Dockerfile.backend \
            --tag $IMAGE_TAG \
            --tag $IMAGE_LATEST \
            --cache-from $IMAGE_LATEST \
            .

          docker push $IMAGE_TAG
          docker push $IMAGE_LATEST

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # ── 5. Deploy to Azure Container Apps ────────────────────────────────
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.AZURE_CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.IMAGE_TAG }}
          registryUrl: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          registryUsername: ${{ secrets.REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REGISTRY_PASSWORD }}
          targetPort: 8000
          ingress: external

      # ── 6. Verify Deployment ──────────────────────────────────────────────
      - name: Smoke test — ping backend health
        run: |
          sleep 20  # Allow container to start
          BACKEND_URL=$(az containerapp show \
            --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "Backend deployed at: https://$BACKEND_URL"
          curl --fail "https://$BACKEND_URL/" || echo "Health check failed — check Azure portal"

      # ── 7. Logout ─────────────────────────────────────────────────────────
      - name: Azure Logout
        run: az logout
        if: always()
